name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The oldest supported version: PHP CS Fixer asks for it, and the README samples must parse on it.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          extensions: curl, fileinfo, mbstring, xml
          coverage: none
          tools: composer:2.11.1
      - name: Validate composer.json
        run: composer validate --strict
      - run: composer update --no-interaction --no-progress --prefer-dist
      - name: Check the dependencies for security advisories
        run: composer audit
      - name: Syntax check
        run: composer lint
      - name: Format check
        run: composer format:check
      - name: Static analysis (PHPStan max level)
        run: composer analyse
      - name: Check the README code samples
        run: composer check:readme

  test:
    name: Test on PHP ${{ matrix.php }} (${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        dependencies: [highest]
        include:
          # The lowest versions composer.json allows, on the oldest supported PHP version.
          - php: "8.2"
            dependencies: lowest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, mbstring, xml
          coverage: pcov
          tools: composer:2.11.1
      - name: Install the ${{ matrix.dependencies }} dependency versions
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          if [ "$DEPENDENCIES" = lowest ]; then
            composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable
          else
            composer update --no-interaction --no-progress --prefer-dist
          fi
      - name: Syntax check
        run: composer lint
      - name: Unit and conformance tests with coverage
        run: composer test:coverage
      - name: Coverage summary
        run: |
          php -r '$m = simplexml_load_file("build/coverage/clover.xml")->project->metrics;
          $row = fn (string $name, string $all, string $covered): string => sprintf("| %s | %.2f%% |", $name, 100 * (int) $m[$covered] / max(1, (int) $m[$all]));
          echo implode("\n", ["| Metric | Covered |", "| --- | --- |", $row("lines", "statements", "coveredstatements"), $row("methods", "methods", "coveredmethods")]), "\n";' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-php-${{ matrix.php }}-${{ matrix.dependencies }}
          path: build/coverage/
          if-no-files-found: error

  package:
    name: Package on PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, mbstring, xml
          coverage: none
          tools: composer:2.11.1
      - name: Build the archive and install it in a fresh project
        run: php scripts/check-package.php --out package
      - name: Run an example without an API key
        run: |
          composer update --no-interaction --no-progress --prefer-dist --no-dev
          set +e
          output=$(php examples/get-info.php 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          echo "$output" | grep -q 'A nonempty API key'
      - if: matrix.php == '8.5'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/
          if-no-files-found: error

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          persona: pedantic

  integration:
    name: Integration tests (live API)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: integration
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: curl, fileinfo, mbstring, xml
          coverage: none
          tools: composer:2.11.1
      - run: composer update --no-interaction --no-progress --prefer-dist
      # Every test is skipped when the integration environment has no EASYSLIP_API_KEY secret.
      - name: Integration tests
        env:
          EASYSLIP_API_KEY: ${{ secrets.EASYSLIP_API_KEY }}
        run: composer test:integration
